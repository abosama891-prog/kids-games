<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#287b9e" />
    <title>ملفي الشخصي | Bu🤖y&lt;/Code&gt;</title>
    <link rel="stylesheet" href="../common.css" />
    <link rel="stylesheet" href="profile.css" />
  </head>
  <body>
    <main class="profile-shell">
      <header class="profile-header page-card">
        <a class="nav-control" href="../index/index.html" aria-label="العودة للرئيسية">🏠</a>
        <div class="profile-brand" aria-label="Bu🤖y&lt;/Code&gt;">
          <img src="../../icons/icon-192.png" alt="" />
          <span>Bu🤖y</span>
          <small>&lt;/Code&gt;</small>
        </div>
        <h1>ملفي الشخصي</h1>
        <p>حدّث اسمك وشخصيتك ورمز دخولك.</p>
      </header>

      <form id="profile-form" class="profile-card page-card">
        <section class="profile-section" aria-labelledby="avatar-title">
          <h2 id="avatar-title">اختر شخصيتك</h2>
          <div class="avatar-options">
            <label class="avatar-option">
              <input type="radio" name="avatar" value="child" />
              <span class="avatar-emoji" aria-hidden="true">🧒</span>
              <span>بطل</span>
            </label>
            <label class="avatar-option">
              <input type="radio" name="avatar" value="girl" />
              <span class="avatar-emoji" aria-hidden="true">👧🏻</span>
              <span>بطلة</span>
            </label>
            <label class="avatar-option">
              <input type="radio" name="avatar" value="engineer" />
              <span class="avatar-emoji" aria-hidden="true">🧑🏻‍💻</span>
              <span>مهندس</span>
            </label>
          </div>
        </section>

        <label class="field-label" for="full-name">
          الاسم الظاهر
          <input id="full-name" name="fullName" type="text" maxlength="60" autocomplete="name" required />
        </label>

        <section id="credential-section" class="profile-section credential-section" aria-labelledby="credential-title">
          <h2 id="credential-title">تغيير كلمة المرور أو رمز الدخول</h2>
          <label class="field-label" for="current-credential">
            كلمة المرور أو الرمز الحالي
            <input id="current-credential" name="currentCredential" type="password" autocomplete="current-password" />
          </label>
          <label class="field-label" for="new-credential">
            الجديد (6 أرقام على الأقل أو كلمة مرور من 6 أحرف فأكثر)
            <input id="new-credential" name="newCredential" type="password" autocomplete="new-password" minlength="6" maxlength="128" />
          </label>
          <label class="field-label" for="confirm-credential">
            تأكيد الجديد
            <input id="confirm-credential" name="confirmCredential" type="password" autocomplete="new-password" minlength="6" maxlength="128" />
          </label>
          <p id="credential-help" class="field-help">اترك خانات كلمة المرور فارغة إذا كنت تريد تغيير الاسم أو الصورة فقط.</p>
        </section>

        <p id="profile-message" class="profile-message" role="status" aria-live="polite" hidden></p>
        <div class="profile-actions">
          <a class="secondary-button" href="../index/index.html">رجوع</a>
          <button class="save-button" type="submit">حفظ التغييرات</button>
        </div>
      </form>
    </main>

    <script src="../common.js"></script>
    <script src="profile.js"></script>
  </body>
</html>
