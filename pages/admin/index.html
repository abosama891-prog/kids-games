<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>إدارة المستخدمين والصلاحيات | 🌈 Buddy 🌈</title>
    <link rel="stylesheet" href="../common.css" />
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <div class="admin-shell">
      <header class="admin-header page-card">
        <div class="header-top">
          <div>
            <span class="eyebrow">لوحة الإدارة</span>
            <h1>إدارة المستخدمين والصلاحيات</h1>
          </div>
          <div class="header-actions">
            <a class="nav-control" href="../index/index.html" aria-label="الرئيسية">🏠</a>
            <button id="logout-button" class="logout-button" type="button">تسجيل الخروج</button>
          </div>
        </div>
      </header>

      <main class="admin-content">
        <div id="account-connection" class="connection-status" role="status" aria-live="polite">جارٍ التحقق من ربط الحساب...</div>
        <div id="admin-message" class="admin-message" role="status" aria-live="polite" hidden></div>
        <section class="panel page-card">
          <div class="panel-title-row">
            <h2>المستخدمون والصلاحيات</h2>
            <div class="user-toolbar">
              <label class="search-field">
                <span class="visually-hidden">ابحث باسم المستخدم</span>
                <input id="user-search" type="search" placeholder="ابحث باسم المستخدم..." autocomplete="off" />
              </label>
              <label class="role-filter">
                <span class="visually-hidden">تصفية حسب الدور</span>
                <select id="role-filter">
                  <option value="">كل الأدوار</option>
                  <option value="admin">مدير</option>
                  <option value="teacher">معلم</option>
                  <option value="parent">ولي أمر</option>
                  <option value="child">طفل</option>
                </select>
              </label>
              <button id="email-toggle" class="column-toggle" type="button" aria-expanded="false" aria-controls="users-table">
                ◉ إظهار البريد
              </button>
              <button id="add-user-button" class="primary-btn" type="button">＋ إضافة مستخدم</button>
            </div>
          </div>
          <div class="table-wrap">
            <table id="users-table" class="email-hidden">
              <thead>
                <tr>
                  <th>اسم المستخدم</th>
                  <th class="email-column">البريد</th>
                  <th>الدور</th>
                  <th>الحالة</th>
                  <th>المزود</th>
                  <th>إجراءات</th>
                </tr>
              </thead>
              <tbody id="users-table-body"></tbody>
            </table>
          </div>
          <p id="empty-users" class="empty-users" hidden>لا يوجد مستخدمون يطابقون البحث.</p>
        </section>
      </main>
    </div>

    <dialog id="user-dialog" class="user-dialog" aria-labelledby="dialog-title">
      <form id="user-form" class="user-form">
        <header class="dialog-header">
          <h2 id="dialog-title">إضافة مستخدم جديد</h2>
          <button id="close-dialog-button" class="dialog-close" type="button" aria-label="إغلاق">×</button>
        </header>
        <div class="dialog-fields">
          <label>
            اسم المستخدم
            <input id="username" name="username" type="text" autocomplete="username" placeholder="username" required />
          </label>
          <label id="email-field" hidden>
            البريد الإلكتروني (اختياري)
            <input id="email" name="email" type="email" autocomplete="email" placeholder="name@example.com" />
          </label>
          <label>
            كلمة المرور
            <input id="password" name="password" type="password" autocomplete="new-password" minlength="6" placeholder="6 أحرف على الأقل" required />
            <span id="password-hint" class="field-hint">مطلوبة للحساب الجديد (6 أحرف على الأقل).</span>
          </label>
          <label>
            الصلاحية (الدور)
            <select id="role" name="role">
              <option value="child">طفل</option>
              <option value="parent">ولي أمر</option>
              <option value="teacher">معلم</option>
              <option value="admin">مدير</option>
            </select>
          </label>
          <label id="status-field" hidden>
            حالة الحساب
            <select id="status" name="status">
              <option value="active">نشط</option>
              <option value="inactive">غير نشط</option>
            </select>
          </label>
        </div>
        <p class="form-note">لا يحتاج الحساب الجديد إلى بريد إلكتروني؛ يسجّل الدخول باسم المستخدم وكلمة المرور.</p>
        <footer class="dialog-actions">
          <button id="cancel-dialog-button" class="cancel-action" type="button">إلغاء</button>
          <button id="save-user-button" type="submit" class="primary-btn">إضافة المستخدم</button>
        </footer>
      </form>
    </dialog>

    <script src="../common.js"></script>
    <script src="admin.js"></script>
  </body>
</html>
