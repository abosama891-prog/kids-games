<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#176b63" />
    <title>مهندس الغاز الذكي | أنقذ المدينة</title>
    <link rel="stylesheet" href="../common.css" />
    <link rel="stylesheet" href="gas.css" />
  </head>
  <body>
    <div class="app-shell gas-app">
      <header class="topbar page-card gas-topbar">
        <button class="nav-control back-control" type="button" data-go-back="../games/index.html" aria-label="رجوع للألعاب">⬅️</button>
        <a class="nav-control home-control" href="../index/index.html" aria-label="الرئيسية">🏠</a>
        <div class="stat" aria-label="النجوم">⭐ <strong id="stars">0</strong></div>
        <div class="stat" aria-label="المستوى">🏆 <strong id="level-count">1 / 6</strong></div>
        <span class="game-identity" aria-hidden="true">🏭　→　🏠</span>
      </header>

      <main class="game-panel page-card gas-panel">
        <div class="level-info gas-level-info">
          <span id="level-icon" class="level-mark" aria-hidden="true">🧩</span>
          <h1 id="level-title">1</h1>
          <span id="concept-label" class="visually-hidden"></span>
          <p id="level-hint" class="level-hint">🏭 → ━ → 🏠</p>
          <span id="mission-title" class="visually-hidden" aria-live="polite"></span>
        </div>

        <nav id="level-list" class="level-list" aria-label="اختيار المستوى"></nav>

        <div class="board-wrap gas-board-wrap">
          <div class="city-scene">
            <img class="city-art" src="city.svg" alt="" />
            <div class="station factory-station" aria-label="مصنع الغاز">
              <svg viewBox="0 0 80 80" aria-hidden="true">
                <defs><linearGradient id="factory-wall" x2="0" y2="1"><stop stop-color="#f2a75b"/><stop offset="1" stop-color="#b85e39"/></linearGradient><linearGradient id="factory-metal" x2="0" y2="1"><stop stop-color="#dce7e8"/><stop offset="1" stop-color="#7d9298"/></linearGradient></defs>
                <path d="M12 38 32 25v12l18-12v13l18-12v42H12z" fill="url(#factory-wall)" stroke="#794735" stroke-width="3" stroke-linejoin="round"/>
                <path d="M20 38V12h11v19M49 34V8h11v19" fill="url(#factory-metal)" stroke="#52666c" stroke-width="3"/>
                <path d="M21 48h10v11H21zm18 0h10v11H39zm18 0h10v11H57z" fill="#ffe6a0" stroke="#85553c" stroke-width="2"/>
                <path d="M24 14h3M53 10h3" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </div>
            <span id="gas-color" class="gas-color"><i></i><span class="visually-hidden">غاز أزرق</span></span>
            <div class="pipeline-shell"><div id="pipe-track" class="pipe-track" aria-label="مسار المواسير"></div></div>
            <div id="home-station" class="station home-station" aria-label="منزل المدينة">
              <svg viewBox="0 0 80 80" aria-hidden="true">
                <defs><linearGradient id="house-wall" x2="0" y2="1"><stop stop-color="#fff2c8"/><stop offset="1" stop-color="#e6b969"/></linearGradient><linearGradient id="house-roof" x2="0" y2="1"><stop stop-color="#d87555"/><stop offset="1" stop-color="#9f463b"/></linearGradient></defs>
                <path d="m9 36 31-25 31 25v35H9z" fill="url(#house-wall)" stroke="#805746" stroke-width="3" stroke-linejoin="round"/>
                <path d="m5 37 35-29 35 29-6 7-29-23L11 44z" fill="url(#house-roof)" stroke="#7e4438" stroke-width="3" stroke-linejoin="round"/>
                <path d="M33 49h14v22H33z" fill="#8b5d48"/><path d="M17 45h11v12H17zM53 45h11v12H53z" fill="#9ed8e5" stroke="#705c4d" stroke-width="2"/>
                <path d="M19 47h7M55 47h7" stroke="#fff" stroke-width="2"/>
              </svg>
            </div>
            <div id="branch-diagram" class="branch-diagram" hidden>
              <div id="upper-branch" class="branch-path"><b>🔴</b><span>⬆️</span></div>
              <div id="lower-branch" class="branch-path"><b>🔵</b><span>⬇️</span></div>
            </div>
          </div>

          <div id="mascot-message" class="mascot-message" role="status" aria-live="polite">
            <span aria-hidden="true">🧑‍🔧</span><p>🏭 ➜ 🏠</p>
          </div>
          <div class="city-lights" aria-label="إنارة المدينة"><span>🏠</span><span>🏠</span><span>🏠</span><span>🏠</span></div>
        </div>

        <div id="program-list" class="program-box" aria-label="البرنامج" aria-live="polite"></div>

        <section class="command-toolbar" aria-label="الأوامر">
          <div class="command-control">
            <button class="piece-button straight-piece" type="button" data-piece="straight" aria-label="أنبوب مستقيم">
              <svg viewBox="0 0 80 48" aria-hidden="true"><defs><linearGradient id="tool-straight-metal" x2="0" y2="1"><stop stop-color="#f8ffff"/><stop offset=".45" stop-color="#aebdc1"/><stop offset="1" stop-color="#61747a"/></linearGradient></defs><path d="M8 24h64" stroke="#526168" stroke-width="24" stroke-linecap="round"/><path d="M8 24h64" stroke="url(#tool-straight-metal)" stroke-width="18" stroke-linecap="round"/><path d="M8 24h64" stroke="#369bd2" stroke-width="5" stroke-linecap="round"/><path d="M12 17h56" stroke="#fff" stroke-width="2" stroke-linecap="round"/><path d="M23 13v22M57 13v22" stroke="#697b80" stroke-width="4"/></svg>
            </button>
            <button class="help-q" type="button" aria-label="كود الأنبوب المستقيم" aria-expanded="false">?</button>
            <span class="code-popup" aria-hidden="true">pipeStraight();</span>
          </div>
          <div class="command-control">
            <button class="piece-button elbow-piece" type="button" data-piece="elbow" aria-label="أنبوب منحني">
              <svg viewBox="0 0 80 56" aria-hidden="true"><defs><linearGradient id="tool-elbow-metal" x2="0" y2="1"><stop stop-color="#f8ffff"/><stop offset=".45" stop-color="#aebdc1"/><stop offset="1" stop-color="#61747a"/></linearGradient></defs><path d="M24 8v23q0 14 14 14h32" fill="none" stroke="#526168" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/><path d="M24 8v23q0 14 14 14h32" fill="none" stroke="url(#tool-elbow-metal)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><path d="M24 8v23q0 14 14 14h32" fill="none" stroke="#42aa70" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 19h14M48 38v14" stroke="#697b80" stroke-width="4"/></svg>
            </button>
            <button class="help-q" type="button" aria-label="كود الأنبوب المنحني" aria-expanded="false">?</button>
            <span class="code-popup" aria-hidden="true">pipeTurn();</span>
          </div>
          <div class="command-control">
            <button id="if-else-button" class="piece-button valve-piece" type="button" aria-label="صمام الشرط">
              <svg viewBox="0 0 80 56" aria-hidden="true"><path d="M40 48V29M40 29 18 9M40 29 62 9" fill="none" stroke="#58696f" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M40 48V29M40 29 18 9" fill="none" stroke="#e2534d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M40 29 62 9" fill="none" stroke="#369bd2" stroke-width="5" stroke-linecap="round"/><circle cx="40" cy="29" r="11" fill="#e5b84e" stroke="#835f26" stroke-width="3"/><path d="M40 18V6m-8 0h16" stroke="#66777c" stroke-width="4" stroke-linecap="round"/></svg>
            </button>
            <button class="help-q" type="button" aria-label="كود صمام الشرط" aria-expanded="false">?</button>
            <span class="code-popup" aria-hidden="true">if (gas === 'red') openTop(); else openBottom();</span>
          </div>
          <div class="command-control">
            <button class="repeat-button" type="button" data-repeat="2" aria-label="تكرار مرتين">×2</button>
            <button class="help-q" type="button" aria-label="كود التكرار مرتين" aria-expanded="false">?</button>
            <span class="code-popup" aria-hidden="true">repeat(2) pipeStraight();</span>
          </div>
          <div class="command-control">
            <button class="repeat-button" type="button" data-repeat="3" aria-label="تكرار ثلاث مرات">×3</button>
            <button class="help-q" type="button" aria-label="كود التكرار ثلاث مرات" aria-expanded="false">?</button>
            <span class="code-popup" aria-hidden="true">repeat(3) pipeStraight();</span>
          </div>
          <div class="command-control">
            <button class="repeat-button" type="button" data-repeat="4" aria-label="تكرار أربع مرات">×4</button>
            <button class="help-q" type="button" aria-label="كود التكرار أربع مرات" aria-expanded="false">?</button>
            <span class="code-popup" aria-hidden="true">repeat(4) pipeStraight();</span>
          </div>
          <div class="command-control">
            <button class="repeat-button" type="button" data-repeat="5" aria-label="تكرار خمس مرات">×5</button>
            <button class="help-q" type="button" aria-label="كود التكرار خمس مرات" aria-expanded="false">?</button>
            <span class="code-popup" aria-hidden="true">repeat(5) pipeStraight();</span>
          </div>
          <select id="repeat-count" class="visually-hidden" aria-label="عدد مرات التكرار">
            <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option>
          </select>
        </section>

        <div class="run-row gas-run-row">
          <button id="run-button" class="run-btn success" type="button" aria-label="تشغيل">▶️</button>
          <button id="reset-button" class="run-btn reset" type="button" aria-label="إعادة المستوى">🔄</button>
          <button id="clear-button" class="run-btn clear" type="button" aria-label="مسح الأوامر">🧹</button>
          <button id="next-button" class="run-btn next" type="button" aria-label="المستوى التالي" hidden>➡️</button>
        </div>
      </main>
    </div>

    <script src="../common.js"></script>
    <script src="gas.js"></script>
  </body>
</html>
