<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الألعاب | Bu🤖y&lt;/Code&gt;</title>
    <link rel="stylesheet" href="../common.css" />
    <link rel="stylesheet" href="games.css" />
  </head>
  <body>
    <div class="app-shell games-page">
      <header class="games-header">
        <nav class="page-nav" aria-label="التنقل">
          <button class="nav-control back-control" type="button" data-go-back="../index/index.html" aria-label="رجوع">⬅️</button>
          <a class="nav-control" href="../index/index.html" aria-label="الرئيسية">🏠</a>
        </nav>
        <div class="games-brand-row">
          <div class="brand-lockup" aria-label="Bu🤖y&lt;/Code&gt;">
            <span class="brand-word">Bu🤖y</span>
            <span class="brand-subtitle brand-code">&lt;/Code&gt;</span>
          </div>
          <span class="page-kicker" aria-label="الألعاب">🎮</span>
        </div>
      </header>

      <main>
        <div id="games-message" class="games-message" role="status" aria-live="polite" hidden></div>
        <div class="games-grid" id="gamesGrid" aria-live="polite">
          <a class="game-card game-draw" href="../draw/index.html" aria-label="افتح لعبة الرسم">
            <span class="game-icon" aria-hidden="true">🎨</span>
            <div class="game-details"><h2>الرسم</h2><span class="level-count">0 / 10</span></div>
            <span class="launch-game" aria-hidden="true">▶</span>
          </a>
          <a class="game-card game-maze" href="../maze/index.html" aria-label="افتح لعبة CoD">
            <span class="game-icon" aria-hidden="true">🐰</span>
            <div class="game-details"><h2>CoD</h2><span class="level-count">0 / 20</span></div>
            <span class="launch-game" aria-hidden="true">▶</span>
          </a>
          <a class="game-card game-gas" href="../gas/index.html" aria-label="افتح لعبة المهندس">
            <span class="game-icon" aria-hidden="true">🌉</span>
            <div class="game-details"><h2>المهندس</h2><span class="level-count">0 / 10</span></div>
            <span class="launch-game" aria-hidden="true">▶</span>
          </a>
          <a class="game-card game-frog" href="../frog/index.html" aria-label="افتح لعبة الضفدع">
            <span class="game-icon" aria-hidden="true">🐸</span>
            <div class="game-details"><h2>الضفدع</h2><span class="level-count">0 / 5</span></div>
            <span class="launch-game" aria-hidden="true">▶</span>
          </a>
          <a class="game-card game-potion" href="../potion/index.html" aria-label="افتح لعبة المختبر">
            <span class="game-icon" aria-hidden="true">🧪</span>
            <div class="game-details"><h2>المختبر</h2><span class="level-count">0 / 3</span></div>
            <span class="launch-game" aria-hidden="true">▶</span>
          </a>
          <a class="game-card game-robot" href="../robot/index.html" aria-label="افتح لعبة الألوان">
            <span class="game-icon" aria-hidden="true">🌈</span>
            <div class="game-details"><h2>الألوان</h2><span class="level-count">0 / 10</span></div>
            <span class="launch-game" aria-hidden="true">▶</span>
          </a>
          <a class="game-card game-code-park" href="code-park.html" aria-label="افتح لعبة ملاهي البرمجة">
            <span class="game-icon" aria-hidden="true">🎢</span>
            <div class="game-details"><h2>ملاهي البرمجة</h2><span class="level-count">0 / 5</span></div>
            <span class="launch-game" aria-hidden="true">▶</span>
          </a>
        </div>
      </main>
    </div>

    <script defer src="../common.js"></script>
    <script defer src="games.js"></script>
  </body>
</html>
