
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FPS ملاهي خفيفة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700&display=swap" rel="stylesheet">
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:#000;overflow:hidden;touch-action:none}
#canvas{width:100vw;height:100vh;display:block}
#top{position:fixed;top:0;left:0;right:0;z-index:20;padding:8px;display:none}
#bar{background:rgba(0,0,0,0.8);border-radius:12px;padding:8px 12px;color:#fff;display:flex;justify-content:space-between;font-size:11px}
#bar b{color:#FFD93D}
#mini{position:fixed;top:50px;right:8px;width:90px;height:120px;background:rgba(0,0,0,0.85);border-radius:8px;border:2px solid #fff3;z-index:20;display:none}
#ctrl{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-between;padding:8px 12px;z-index:20;display:none;background:linear-gradient(to top,rgba(0,0,0,0.7),transparent)}
.jb{width:50px;height:50px;background:rgba(255,255,255,0.15);border:2px solid rgba(255,255,255,0.3);border-radius:12px;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;margin:3px;touch-action:none}
.jb.on{background:#FF6B6B}
#act{width:68px;height:68px;background:rgba(0,255,136,0.25);border:2px solid #00ff88;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
#act.near{background:#00ff88;color:#000;animation:pulse 0.7s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
#charSel{position:fixed;inset:0;z-index:100;background:linear-gradient(135deg,#0f0c29,#302b63);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;text-align:center}
#charSel h1{font-size:22px;margin-bottom:6px}
#grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%;max-width:340px;margin:12px 0}
.card{background:rgba(255,255,255,0.08);border:2px solid rgba(255,255,255,0.15);border-radius:14px;padding:10px;cursor:pointer}
.card.sel{border-color:#FFD93D;background:rgba(255,217,61,0.15)}
.card div{width:100%;height:90px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:40px}
.card h3{font-size:11px;margin-top:6px}
#go{margin-top:10px;background:#FFD93D;color:#000;border:0;padding:12px 32px;border-radius:30px;font-weight:800;font-size:15px;opacity:0.4;pointer-events:none}
#go.on{opacity:1;pointer-events:auto}
#modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:60;display:none;align-items:center;justify-content:center;padding:12px}
#mBox{background:#1e1e2f;border:2px solid #4ECDC4;border-radius:16px;max-width:360px;width:100%;padding:14px;color:#fff}
.code{background:#0d1117;border-radius:8px;padding:8px;margin:6px 0;font-family:monospace;direction:ltr;text-align:left;font-size:12px}
.code input{background:#21262d;border:1px solid #444;color:#7ee787;border-radius:5px;padding:3px 5px;width:55px;text-align:center}
.btn{padding:7px 12px;border-radius:8px;border:0;font-weight:700;margin:3px;cursor:pointer;font-size:12px}
.btnP{background:#4ECDC4;color:#000} .btnG{background:rgba(255,255,255,0.15);color:#fff}
#win{position:fixed;inset:0;background:linear-gradient(135deg,#FFD93D,#FF6B6B);z-index:90;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;color:#000}
#cross{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:20px;height:20px;z-index:15;pointer-events:none;display:none}
#cross::before{content:'';position:absolute;top:50%;left:0;right:0;height:2px;background:rgba(255,255,255,0.7)}
#cross::after{content:'';position:absolute;left:50%;top:0;bottom:0;width:2px;background:rgba(255,255,255,0.7)}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="cross"></div>
<div id="top"><div id="bar"><span>👁️ <b id="pName">لاعب</b></span><span><b id="d">0</b>م | <b id="pc">0/5</b></span></div></div>
<div id="mini"><canvas id="mc" width="90" height="120"></canvas></div>
<div id="ctrl"><div style="display:flex;flex-direction:column;align-items:center"><div style="display:flex;justify-content:center"><div class="jb" data-k="w">W</div></div><div style="display:flex"><div class="jb" data-k="a">A</div><div class="jb" data-k="s">S</div><div class="jb" data-k="d">D</div></div></div><div id="act"><span>E</span></div></div>

<div id="charSel">
<h1>🎢 ملاهي البرمجة - منظور أول</h1>
<p style="font-size:11px;opacity:0.7">الشخصية مش هتظهر - هتبقى عينيك بس<br>صور الملاهي مدمجة في المباني حواليك</p>
<div id="grid">
<div class="card" data-id="0" data-name="كابتن كود"><div style="background:#2b6cff">🧢</div><h3>كابتن كود</h3></div>
<div class="card" data-id="1" data-name="الأميرة لوجيك"><div style="background:#FFD93D">👑</div><h3>الأميرة لوجيك</h3></div>
<div class="card" data-id="2" data-name="المبرمج"><div style="background:#2ecc71">💻</div><h3>المبرمج الصغير</h3></div>
<div class="card" data-id="3" data-name="أنت"><div style="background:linear-gradient(45deg,#ff6b6b,#4ecdc4)">📷</div><h3>صورتك</h3></div>
</div>
<p style="font-size:10px;opacity:0.6;margin-top:8px">👁️ منظور أول FPS • 🖼️ صور ملاهي على الجدران • 🚶 شخصية مخفية</p>
<button id="go">ادخل الملاهي 🚀</button>
</div>

<div id="modal"><div id="mBox"><h2 id="mT"></h2><p id="mS" style="font-size:11px;opacity:0.8;margin:6px 0"></p><div id="mB"></div></div></div>
<div id="win"><h1>🏆 وصلت يا <span id="winN">بطل</span>!</h1><p>300م في ملاهي واقعية</p><button class="btn btnP" style="background:#000;color:#FFD93D;margin-top:10px" onclick="location.reload()">العب تاني</button></div>

<script type="module">
import * as THREE from 'three';
let scene,camera,renderer;
let keys={w:false,a:false,s:false,d:false}, yaw=0, pitch=0;
let pos=new THREE.Vector3(0,1.7,18);
let gates=[], solved=[false,false,false,false,false], curr=-1, batteries=[], collected=[false,false,false];
let sel=0, selName="لاعب";
let gateData=[
{p:-42,t:"حاجز فيريس: المتغيرات",s:"اجمع 3 بطاريات"},
{p:-92,t:"حاجز الرولر: الحلقات",s:"القطار محتاج 4 لفات"},
{p:-142,t:"حاجز التصادم: الشروط",s:"فعل الشرطين"},
{p:-192,t:"حاجز الكاروسيل: الدوال",s:"شغل الدالة"},
{p:-252,t:"البوابة الذهبية",s:"صلح الأقواس"}
];

document.querySelectorAll('.card').forEach(c=>{
 c.addEventListener('click',()=>{
  document.querySelectorAll('.card').forEach(x=>x.classList.remove('sel')); c.classList.add('sel');
  sel=parseInt(c.dataset.id); selName=c.dataset.name; document.getElementById('go').classList.add('on');
 });
});
document.getElementById('go').addEventListener('click',()=>{
 if(!document.getElementById('go').classList.contains('on')) return;
 document.getElementById('charSel').style.display='none';
 document.getElementById('top').style.display='block';
 document.getElementById('mini').style.display='block';
 document.getElementById('ctrl').style.display='flex';
 document.getElementById('cross').style.display='block';
 document.getElementById('pName').innerText=selName;
 document.getElementById('winN').innerText=selName;
 init();
});

function init(){
scene=new THREE.Scene(); scene.background=new THREE.Color(0x87CEEB); scene.fog=new THREE.Fog(0x87CEEB,50,160);
camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,500);
renderer=new THREE.WebGLRenderer({canvas:document.getElementById('canvas'),antialias:true}); rend
erer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(1);
scene.add(new THREE.AmbientLight(0xffffff,0.8));
let sun=new THREE.DirectionalLight(0xffffff,1); sun.position.set(50,70,20); scene.add(sun);
let grass=new THREE.Mesh(new THREE.PlaneGeometry(600,600),new THREE.MeshStandardMaterial({color:0x2d8a1e})); grass.rotation.x=-Math.PI/2; grass.position.y=0; scene.add(grass);
let road=new THREE.Mesh(new THREE.PlaneGeometry(12,360),new THREE.MeshStandardMaterial({color:0x222222})); road.rotation.x=-Math.PI/2; road.position.y=0.02; scene.add(road);
for(let z=20;z>-330;z-=4){let l=new THREE.Mesh(new THREE.PlaneGeometry(0.45,2),new THREE.MeshBasicMaterial({color:0xffffff})); l.rotation.x=-Math.PI/2; l.position.set(0,0.04,z); scene.add(l);}

// buildings with park images integrated as colored facades with icons
for(let i=0;i<16;i++){
 let z=10 - i*18;
 let side = i%2==0 ? -1 : 1;
 let x = side*9;
 let h = 5+Math.random()*3;
 let colors=[0xff6b6b,0x4ecdc4,0xffe66d,0x6c5ce7,0xff8a5b];
 let building=new THREE.Mesh(new THREE.BoxGeometry(2.5,h,11),new THREE.MeshStandardMaterial({color:colors[i%5]}));
 building.position.set(x,h/2,z); scene.add(building);
 // billboard with ride icon (instead of heavy photo)
 let canvas=document.createElement('canvas'); canvas.width=256; canvas.height=128;
 let ctx=canvas.getContext('2d');
 ctx.fillStyle=['#ff6b6b','#4ecdc4','#ffe66d','#6c5ce7','#ff8a5b'][i%5];
 ctx.fillRect(0,0,256,128);
 ctx.fillStyle='#000'; ctx.font='bold 48px Arial'; ctx.textAlign='center';
 let icons=['🎡','🎢','🎠','🎪','🎯','🎰','🎨','🎭'];
 ctx.fillText(icons[i%8],128,80);
 let tex=new THREE.CanvasTexture(canvas);
 let bill=new THREE.Mesh(new THREE.PlaneGeometry(9,4.5),new THREE.MeshBasicMaterial({map:tex,transparent:true}));
 bill.position.set(x + (side>0?-1.6:1.6), h/2+1, z);
 bill.rotation.y = side>0 ? Math.PI/2 : -Math.PI/2;
 scene.add(bill);
}

gateData.forEach((gd,i)=>{
 let gg=new THREE.Group();
 let wall=new THREE.Mesh(new THREE.BoxGeometry(12,5,0.8),new THREE.MeshStandardMaterial({color:0xff2222,emissive:0x440000,transparent:true,opacity:0.9}));
 wall.position.y=2.5; gg.add(wall);
 gg.position.set(0,0,gd.p); scene.add(gg); gates.push({g:gg,w:wall,p:gd.p,i:i});
});

[[-1.5,-38,5],[1.2,-45,10],[2.5,-32,15]].forEach((p,i)=>{
 let b=new THREE.Mesh(new THREE.SphereGeometry(0.45,10,10),new THREE.MeshStandardMaterial({color:0x00ff88,emissive:0x00aa44}));
 b.position.set(p[0],0.8,p[1]); b.userData={i:i}; scene.add(b); batteries.push(b);
});

let castle=new THREE.Mesh(new THREE.BoxGeometry(20,12,10),new THREE.MeshStandardMaterial({color:0xFFD700}));
castle.position.set(0,6,-308); scene.add(castle);

loop();
}

function loop(){
 requestAnimationFrame(loop);
 let speed=0.22, strafe=0.15;
 let moveX=0, moveZ=0;
 if(keys.w){ moveX+= -Math.sin(yaw)*speed; moveZ+= -Math.cos(yaw)*speed; }
 if(keys.s){ moveX+= Math.sin(yaw)*speed; moveZ+= Math.cos(yaw)*speed; }
 if(keys.a){ moveX+= -Math.cos(yaw)*strafe; moveZ+= Math.sin(yaw)*strafe; }
 if(keys.d){ moveX+= Math.cos(yaw)*strafe; moveZ+= -Math.sin(yaw)*strafe; }
 let np=pos.clone(); np.x+=moveX; np.z+=moveZ;
 if(Math.abs(np.x)<5){
  let blocked=false;
  gates.forEach(g=>{if(!solved[g.i] && Math.abs(np.z-g.p)<0.9) blocked=true;});
  if(!blocked) pos.copy(np);
 }
 batteries.forEach(b=>{b.rotation.y+=0.04; if(!collected[b.userData.i] && pos.distanceTo(b.position)<1.4){collected[b.userData.i]=true; b.visible=false; document.getElementById('act').classList.add('near'); setTimeout(()=>document.getElementById('act').classList.remove('near'),400);}});
 gates.forEach(g=>{if(!solved[g.i] && Math.abs(pos.z-g.p)<6){document.getElementById('act').classList.add('near'); curr=g.i;}});
 document.getElementById('d').innerText=Math.max(0,Math.floor(18-pos.z));
 document.getElementById('pc').innerText=solved.filter(Boolean).length+'/5';
 camera.position.copy(pos);
 camera.rotation.order='YXZ';
 camera.rotation.y=yaw;
 camera.rotation.x=pitch;
 drawMini();
 renderer.render(scene,camera);
}

function drawMini(){
 let c=document.getElementById('mc'), ctx=c.getContext('2d');
 ctx.fillStyle='#0a0a0a'; ctx.fillRect(0,0,90,120);
 ctx.fillStyle='#3a3a3a'; ctx.fillRect(35,0,20,120);
 gates.forEach(g=>{let y=((g.p+310)/330)*120; ctx.fillStyle=solved[g.i]?'#0f8':'#f33'; ctx.fillRect(33,y,24,4);});
 let py=((pos.z+310)/330)*120, px=45+pos.x*2;
 ctx.fillStyle='#FFD93D'; ctx.beginPath(); ctx.arc(px,py,3,0,Math.PI*2); ctx.fill();
}

function openP(i){
 let gd=gateData[i];
 document.getElementById('mT').innerText=gd.t;
 document.getElementById('mS').innerText=gd.s;
 let html="";
 if(i==0) html+="<div class='code'>x=<input id='v0' value='"+(collected[0]?5:'')+"'> y=<input id='v1' value='"+(collected[1]?10:'')+"'> z=<input id='v2' value='"+(collected[2]?15:'')+"'></div><button class='btn btnP' onclick='check0()'>افتح 🔓</button>";
 if(i==1) html+="<div class='code'>for(i=0;i&lt;<input id='l1'>;i++)</div><button class='btn btnP' onclick='if(l1.value==\"4\")solve("+i+"); else alert(\"لازم 4\")'>شغل</button>";
 if(i==2) html+="<div class='code'><label><input type='checkbox' id='c1'> تذكرة</label><br><label><input type='checkbox' id='c2'> كود</label></div><button class='btn btnP' onclick='if(c1.checked&&c2.checked)solve("+i+"); else alert(\"فعل الاتنين\")'>جرب</button>";
 if(i==3) html+="<div class='code'><input id='fc' placeholder='startRide();' style='width:140px'></div><button class='btn btnP' onclick='let v=fc.value.trim(); if(v==\"startRide();\"||v==\"startRide()\")solve("+i+"); else alert(\"اكتب startRide();\")'>شغل</button>";
 if(i==4) html+="<div class='code'>صلح )</div><button class='btn btnP' id='b1' onclick='this._a=true; this.textContent=\"✅\";'>قوس 1</button> <button class='btn btnP' id='b2' onclick='this._b=true; this.textContent=\"✅\"; if(document.getElementById(\"b1\")._a && this._b) solve(4);'>قوس 2</button>";
 html+="<button class='btn btnG' onclick='closeM()'>إلغاء</button><div id='err' style='color:#f66;font-size:11px'></div>";
 document.getElementById('mB').innerHTML=html;
 document.getElementById('modal').style.display='flex';
}
window.check0=function(){let a=v0.value,b=v1.value,c=v2.value; if(a=='5'&&b=='10'&&c=='15')solve(curr); else err.innerText='لازم 5,10,15';};
window.solve=function(i){solved[i]=true; gates[i].w.material.color.set(0x00ff88); gates[i].g.scale.y=0.1; closeM(); document.getElementById('act').classList.remove('near'); if(solved.filter(Boolean).length==5) setTimeout(()=>{document.getElementById('win').style.display='flex';},400);};
window.closeM=function(){document.getElementById('modal').style.display='none';};

document.querySelectorAll('.jb').forEach(b=>{
 let k=b.dataset.k;
 let s=()=>{keys[k]=true; b.classList.add('on');}, e=()=>{keys[k]=false; b.classList.remove('on');};
 b.addEventListener('touchstart',ev=>{ev.preventDefault(); s();}); b.addEventListener('touchend',e); b.addEventListener('mousedown',s); b.addEventListener('mouseup',e); b.addEventListener('mouseleave',e);
});
document.getElementById('act').addEventListener('click',()=>{if(curr>=0 && !solved[curr]) openP(curr);});
let sx=0, sy=0;
document.getElementById('canvas').addEventListener('touchstart',e=>{sx=e.touches[0].clientX; sy=e.touches[0].clientY;});
document.getElementById('canvas').addEventListener('touchmove',e=>{
 let dx=e.touches[0].clientX-sx, dy=e.touches[0].clientY-sy;
 yaw-=dx*0.008; pitch=Math.max(-0.6,Math.min(0.6,pitch-dy*0.008));
 sx=e.touches[0].clientX; sy=e.touches[0].clientY;
 e.preventDefault();
},{passive:false});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
