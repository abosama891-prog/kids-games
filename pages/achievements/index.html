<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#176b63" />
    <title>إنجازاتي | Bu🤖y&lt;/Code&gt;</title>
    <link rel="stylesheet" href="../common.css" />
    <link rel="stylesheet" href="achievements.css" />
  </head>
  <body>
    <div class="app-shell achievements-page">
      <header class="achievements-header">
        <nav class="page-nav" aria-label="التنقل">
          <button class="nav-control back-control" type="button" data-go-back="../index/index.html" aria-label="رجوع">
            ⬅️
          </button>
          <a class="nav-control nav-link" href="../index/index.html" aria-label="الرئيسية">
            🏠
          </a>
          <a class="nav-control nav-link" href="../maze/index.html" aria-label="اللعب">
            ▶️
          </a>
        </nav>
        <div class="heading-row">
          <div>
            <p class="eyebrow">رحلتك في تعلم البرمجة</p>
            <div class="brand-lockup" aria-label="Bu🤖y&lt;/Code&gt;">
              <span class="brand-word">Bu🤖y</span>
              <span class="brand-subtitle brand-code">&lt;/Code&gt;</span>
            </div>
            <h1>إنجازاتي</h1>
            <p class="header-copy">كل نجمة ووسام يحكي خطوة جديدة تعلمتها.</p>
          </div>
          <div class="trophy-mark" aria-hidden="true">🏆</div>
        </div>
      </header>

      <main>
        <section class="achievement-overview" aria-label="ملخص التقدم">
          <div class="overview-stat">
            <span>النجوم</span>
            <strong id="totalStars">0</strong>
          </div>
          <div class="overview-stat">
            <span>الأوسمة المفتوحة</span>
            <strong id="earnedCount">0 / 6</strong>
          </div>
          <div class="overview-stat">
            <span>المستويات المكتملة</span>
            <strong id="completedCount">0</strong>
          </div>
          <div class="overview-stat next-stat">
            <span>الخطوة التالية</span>
            <strong id="nextGoal">ابدأ أول لعبة</strong>
          </div>
        </section>

        <section class="badges-section" aria-labelledby="badgesTitle">
          <div class="section-heading">
            <div>
              <p class="eyebrow">مجموعتك</p>
              <h2 id="badgesTitle">أوسمة التعلم</h2>
            </div>
            <p id="progressSummary" class="progress-summary">ابدأ اللعب لتظهر إنجازاتك هنا.</p>
          </div>
          <div class="badges-grid" id="badgesGrid" aria-live="polite"></div>
        </section>

        <section class="game-progress" aria-labelledby="gameProgressTitle">
          <div class="section-heading">
            <div>
              <p class="eyebrow">تقدمك في الألعاب</p>
              <h2 id="gameProgressTitle">كل لعبة لها حكاية</h2>
            </div>
          </div>
          <div class="game-progress-grid" id="gameProgressGrid"></div>
        </section>
      </main>

      <footer class="page-footer">
        <a href="../index/index.html" aria-label="الرئيسية">🏠</a>
      </footer>
    </div>

    <script src="../common.js"></script>
    <script src="achievements.js"></script>
  </body>
</html>
