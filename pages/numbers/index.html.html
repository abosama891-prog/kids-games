<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>مختبر الأرقام - Buddy Code</title>
<link rel="stylesheet" href="../common.css">
<link rel="stylesheet" href="numbers.css">
</head>
<body>
<div class="game-wrap">
  <header class="game-top">
    <a href="../games/index.html" class="back">←</a>
    <h1>🧪 مختبر الأرقام</h1>
    <div class="stars">⭐ <span id="stars-count">0</span></div>
  </header>

  <div class="info-bar">
    <div class="info-item">
      <span>المستوى</span>
      <b id="level-num">1</b>
    </div>
    <div class="info-item">
      <span>🔥 متتالية</span>
      <b id="streak">0</b>
    </div>
    <div class="info-item">
      <span>المرحلة</span>
      <b id="stage-name">المنطق</b>
    </div>
  </div>

  <div class="levels-bar" id="levels-bar"></div>

  <div class="question-card">
    <p class="question-label">🔍 السؤال</p>
    <div class="numbers-row" id="numbers-row"></div>
  </div>

  <div class="hint-box" id="hint-box">
    <p class="hint-label">💡 درس مصغر</p>
    <code id="hint-text"></code>
  </div>

  <div class="answers" id="answers"></div>

  <div class="message" id="message"></div>
</div>
<script src="../common.js"></script>
<script src="numbers.js"></script>
</body>
</html>
