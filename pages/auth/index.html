<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تسجيل الدخول | Bu🤖y&lt;/Code&gt;</title>
    <meta name="theme-color" content="#176b63" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Bu🤖y" />
    <link rel="manifest" href="../../manifest.webmanifest" />
    <link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="../common.css" />
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body>
    <div class="auth-shell">
      <main class="auth-card login-device">
        <section id="splash-screen" class="splash-screen" aria-label="شاشة بداية Bu🤖y">
          <div class="splash-branding">
            <div class="splash-logo" id="splash-logo" aria-hidden="true">👾⚡</div>
            <div class="splash-title">Bu🤖y</div>
            <div class="splash-code">&lt;/Code&gt;</div>
          </div>
          <p class="splash-tagline">تعلّم البرمجة… والعب بطريقتك</p>
          <button id="start-button" class="start-button" type="button">▶ START</button>
          <div class="splash-status"><span></span> جاهز للمغامرة</div>
        </section>

        <div id="account-screen" class="account-screen" hidden>
          <button id="back-to-splash" class="back-to-splash" type="button" aria-label="العودة إلى شاشة البداية">←</button>
        <div class="auth-header">
          <div class="auth-brand-row">
            <span class="pill brand-lockup" aria-label="Bu🤖y&lt;/Code&gt;">
              <span class="brand-word">Bu🤖y</span>
              <span class="brand-subtitle brand-code">&lt;/Code&gt;</span>
            </span>
            <div class="brand-bubble" aria-label="شعار التطبيق"><img src="../../icons/icon-192.png" alt="" /></div>
          </div>
        </div>

        <section id="login-panel" class="auth-panel">
          <div class="app-install-prompt">
            <button class="install-app-button" type="button" data-install-app>📲 تثبيت التطبيق</button>
            <p class="install-help" data-install-help role="status" aria-live="polite" hidden></p>
          </div>
          <form id="login-form" class="login-form">
            <label for="username">اسم المستخدم</label>
            <input id="username" name="username" autocomplete="username" required placeholder="مثال: child" />
            <label for="password">رمز الدخول أو كلمة المرور</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="رمز قديم من 4 أرقام أو رمز جديد من 6 أرقام فأكثر" />
            <button class="submit-btn" type="submit">دخول</button>
          </form>

          <button id="show-signup" class="auth-switch" type="button">ليس لديك حساب؟ أنشئ حسابًا جديدًا</button>

        </section>

        <section id="signup-panel" class="auth-panel" hidden>
          <form id="signup-form" class="login-form">
            <label for="signup-full-name">الاسم</label>
            <input id="signup-full-name" name="fullName" autocomplete="name" required maxlength="60" placeholder="اكتب اسمك" />
            <label for="signup-username">اسم المستخدم</label>
            <input id="signup-username" name="username" autocomplete="username" required minlength="1" maxlength="32" pattern="[A-Za-z0-9._-]{1,32}" placeholder="حرف إنجليزي أو رقم على الأقل" />
            <label for="signup-pin">رمز الدخول (6 أرقام على الأقل)</label>
            <input id="signup-pin" name="pin" type="password" inputmode="numeric" autocomplete="new-password" required minlength="6" maxlength="128" pattern="[0-9٠-٩۰-۹]{6,128}" placeholder="اختر رمزًا من 6 أرقام على الأقل" />
            <label for="signup-pin-confirm">تأكيد رمز الدخول</label>
            <input id="signup-pin-confirm" name="pinConfirm" type="password" inputmode="numeric" autocomplete="new-password" required minlength="6" maxlength="128" pattern="[0-9٠-٩۰-۹]{6,128}" placeholder="أعد كتابة الرمز" />
            <label for="signup-role">نوع الحساب</label>
            <select id="signup-role" name="role" required>
              <option value="child">طفل</option>
              <option value="teacher">معلم</option>
              <option value="parent">ولي أمر</option>
            </select>
            <fieldset class="avatar-field">
              <legend>اختر شخصيتك</legend>
              <div class="avatar-choices">
                <label class="avatar-choice">
                  <input type="radio" name="avatar" value="child" checked />
                  <span aria-hidden="true">🧒</span>
                  <span class="visually-hidden">طفل</span>
                </label>
                <label class="avatar-choice">
                  <input type="radio" name="avatar" value="girl" />
                  <span aria-hidden="true">👧🏻</span>
                  <span class="visually-hidden">طفلة</span>
                </label>
                <label class="avatar-choice">
                  <input type="radio" name="avatar" value="engineer" />
                  <span aria-hidden="true">🧑🏻‍💻</span>
                  <span class="visually-hidden">مهندس</span>
                </label>
              </div>
            </fieldset>
            <button class="submit-btn" type="submit">إنشاء حساب</button>
          </form>
          <button id="show-login" class="auth-switch" type="button">لديك حساب؟ تسجيل الدخول</button>
        </section>

        <div id="auth-message" class="auth-message" aria-live="polite"></div>
        </div>
      </main>
    </div>

    <script src="../common.js"></script>
    <script src="auth.js"></script>
  </body>
</html>
