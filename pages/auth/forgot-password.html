<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>نسيت كلمة المرور | Bu🤖y&lt;/Code&gt;</title>
    <meta name="theme-color" content="#176b63" />
    <link rel="stylesheet" href="../common.css" />
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body>
    <div class="auth-shell">
      <main class="auth-card login-device">
        <section class="account-screen">
          <div class="auth-header">
            <div class="auth-brand-row">
              <span class="pill brand-lockup" aria-label="Bu🤖y&lt;/Code&gt;">
                <span class="brand-word">Bu🤖y</span>
                <span class="brand-subtitle brand-code">&lt;/Code&gt;</span>
              </span>
              <div class="brand-bubble" aria-label="شعار التطبيق">
                <img src="../../icons/icon-192.png" alt="" />
              </div>
            </div>
          </div>

          <section class="auth-panel">
            <h1>إعادة تعيين كلمة المرور</h1>
            <p>
              أدخل الإيميل الحقيقي المرتبط بحسابك لإرسال رابط إعادة التعيين.
              حسابات اسم المستخدم التي تستخدم عنوانًا ينتهي بـ
              <code>.invalid</code> لا يمكنها استقبال البريد.
            </p>
            <form id="forgot-password-form" class="login-form">
              <label for="forgot-password-email">الإيميل</label>
              <input
                id="forgot-password-email"
                name="email"
                type="email"
                autocomplete="email"
                inputmode="email"
                required
                maxlength="254"
                placeholder="name@example.com"
              />
              <button class="submit-btn" type="submit">إرسال رابط إعادة التعيين</button>
            </form>
            <p id="auth-message" class="auth-message" role="status" aria-live="polite"></p>
            <a class="auth-switch" href="index.html">العودة إلى تسجيل الدخول</a>
          </section>
        </section>
      </main>
    </div>

    <script src="../common.js"></script>
    <script src="auth.js"></script>
  </body>
</html>
